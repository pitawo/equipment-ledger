<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント登録 - 備品台帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-50 font-sans text-slate-900 flex items-center justify-center min-h-screen py-10">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter text-indigo-600 mb-2"><i
                    class="fa-solid fa-box mr-2"></i>備品台帳 <span class="text-slate-400 font-light">PRO</span></h1>
            <p class="text-slate-500 font-medium text-sm">新規アカウント作成</p>
        </div>

        {% if error %}
        <div class="mb-4 bg-rose-50 text-rose-500 p-3 rounded-lg text-sm flex items-center">
            <i class="fa-solid fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase block mb-1">氏名</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" name="name" required placeholder="山田 太郎"
                        class="pl-10 w-full border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase block mb-1">メールアドレス</label>
                <div class="relative">
                    <i
                        class="fa-solid fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="email" name="email" required placeholder="user@example.com"
                        class="pl-10 w-full border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase block mb-1">パスワード</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="password" name="password" required placeholder="••••••••" minlength="6"
                        class="pl-10 w-full border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <p class="text-[10px] text-slate-400 mt-1">6文字以上で入力してください</p>
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-100 mt-6">
                登録する
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <p class="text-slate-500">すでにアカウントをお持ちですか？ <br class="sm:hidden"><a href="/login"
                    class="text-indigo-600 font-bold hover:underline">ログインはこちら</a></p>
        </div>
    </div>
</body>

</html>
